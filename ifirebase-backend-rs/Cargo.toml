[package]
name = "ifirebase-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
jsonwebtoken = "9.2.1"
reqwest = "0.12.12"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3     # Maximum optimization (default)
lto = true        # Enable Link-Time Optimization
codegen-units = 1 # Better optimizations (slower compile)
panic = "abort"   # Smaller binary size (no panic unwind)
strip = true      # Remove debug symbols (smaller binary)
